# ==================================
# TEST PROFILE CONFIGURATION
# ==================================
spring.application.name=face2hire-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aiinterview\
?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Musthafa}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=test-jwt-secret-key-minimum-256-bits-for-hs256-signing-algorithm

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=testpassword
sendgrid.api.key=test-sendgrid-key

app.frontend-url=http://localhost:5173
app.backend-url=http://localhost:8080
app.base-url=http://localhost:8080

aws.s3.enabled=false
aws.s3.local-fallback=true
storage.local.dir=uploads
aws.s3.bucket=test-bucket
aws.region=ap-south-1
aws.s3.region=ap-south-1
aws.access-key-id=test-key
aws.secret-access-key=test-secret

openai.api.key=test-key
openai.whisper.model=whisper-1
openai.gpt.model=gpt-4o-mini
openai.tts.model=tts-1

otp.expiry.seconds=180
otp.max.requests.per.hour=3
otp.block.duration.minutes=15
otp.max.failed.attempts=3
otp.failed.attempts.window.minutes=5
otp.cleanup.interval.seconds=30
otp.max.cache.size=10000

# OAuth test configs
spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.github.client-id=test-github-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret

management.health.mail.enabled=false
