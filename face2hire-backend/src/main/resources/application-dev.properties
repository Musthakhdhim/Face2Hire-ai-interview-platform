# ==================================
# DEVELOPMENT PROFILE CONFIGURATION
# ==================================
spring.application.name=face2hire-backend
server.port=${SERVER_PORT:8080}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend-url=${APP_BACKEND_URL:http://localhost:${server.port:8080}}
app.base-url=${APP_BASE_URL:${app.backend-url}}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aiinterview\
?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Musthafa}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:face2hire-dev-secret-key-minimum-256-bits-for-hs256-signing-algorithm}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:musthafaputhukkudi177@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:dev-mail-password}

# TLS configuration
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

sendgrid.api.key=${SENDGRID_API_KEY:dev-sendgrid-api-key}

# Google OAuth2 Provider Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-secret}
spring.security.oauth2.client.registration.google.scope=email, profile
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend-url}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=\
${OAUTH_GITHUB_CLIENT_ID:${GITHUB_CLIENT_ID:dev-github-client-id}}
spring.security.oauth2.client.registration.github.client-secret=\
${OAUTH_GITHUB_CLIENT_SECRET:${GITHUB_CLIENT_SECRET:dev-github-secret}}
spring.security.oauth2.client.registration.github.scope=user:email, read:user
spring.security.oauth2.client.registration.github.redirect-uri=${app.backend-url}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-name=Github

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Storage & AWS S3
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.local-fallback=${AWS_S3_LOCAL_FALLBACK:true}
storage.local.dir=${STORAGE_LOCAL_DIR:uploads}
aws.s3.bucket=${AWS_S3_BUCKET_NAME:${AWS_S3_BUCKET:ai-interview-profile-images}}
aws.region=${AWS_REGION:${AWS_S3_REGION:ap-south-1}}
aws.s3.region=${aws.region}
aws.access-key-id=${AWS_ACCESS_KEY_ID:${AWS_S3_ACCESS_KEY_ID:dev-access-key}}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:${AWS_S3_SECRET_ACCESS_KEY:dev-secret-key}}
interview.audio.presigned.url.expiry.minutes=15

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Log file location
logging.file.name=logs/ai-interview-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10

openai.api.key=${OPENAI_API_KEY:dev-openai-api-key}
openai.whisper.model=whisper-1
openai.gpt.model=gpt-4o-mini
openai.tts.model=tts-1

# Zoom Configuration
zoom.account-id=${ZOOM_ACCOUNT_ID:dev-zoom-account-id}
zoom.client-id=${ZOOM_CLIENT_ID:dev-zoom-client-id}
zoom.client-secret=${ZOOM_CLIENT_SECRET:dev-zoom-client-secret}
zoom.timezone=${ZOOM_TIMEZONE:Asia/Kolkata}

# OTP Configuration
otp.expiry.seconds=180
otp.max.requests.per.hour=3
otp.block.duration.minutes=15
otp.max.failed.attempts=3
otp.failed.attempts.window.minutes=5
otp.cleanup.interval.seconds=30
otp.max.cache.size=10000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
