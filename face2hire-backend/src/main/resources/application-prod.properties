# ==================================
# PRODUCTION PROFILE CONFIGURATION
# ==================================
spring.application.name=face2hire-backend
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}

# Frontend & Backend URLs
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend-url=${APP_BACKEND_URL:http://localhost:${server.port:8080}}
app.base-url=${APP_BASE_URL:${app.backend-url}}

# Database Configuration (Supports both DB_URL and RDS_* variables)
spring.datasource.url=${DB_URL:jdbc:mysql://${RDS_HOST:localhost}:3306/${RDS_DATABASE:aiinterview}\
?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:${RDS_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${RDS_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:face2hire-prod-secret-key-minimum-256-bits-for-hs256-signing-algorithm}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:noreply@face2hire.shop}
spring.mail.password=${EMAIL_PASSWORD:prod-mail-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

sendgrid.api.key=${SENDGRID_API_KEY:prod-sendgrid-api-key}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:prod-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:prod-google-secret}
spring.security.oauth2.client.registration.google.scope=email, profile
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend-url}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=\
${OAUTH_GITHUB_CLIENT_ID:${GITHUB_CLIENT_ID:prod-github-client-id}}
spring.security.oauth2.client.registration.github.client-secret=\
${OAUTH_GITHUB_CLIENT_SECRET:${GITHUB_CLIENT_SECRET:prod-github-secret}}
spring.security.oauth2.client.registration.github.scope=user:email, read:user
spring.security.oauth2.client.registration.github.redirect-uri=${app.backend-url}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-name=Github

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Storage & AWS S3 (Local storage fallback enabled since S3 bucket was removed)
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.local-fallback=${AWS_S3_LOCAL_FALLBACK:true}
storage.local.dir=${STORAGE_LOCAL_DIR:uploads}
aws.s3.bucket=${AWS_S3_BUCKET_NAME:${AWS_S3_BUCKET:ai-interview-profile-images}}
aws.region=${AWS_REGION:${AWS_S3_REGION:ap-south-1}}
aws.s3.region=${aws.region}
aws.access-key-id=${AWS_ACCESS_KEY_ID:${AWS_S3_ACCESS_KEY_ID:prod-access-key}}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:${AWS_S3_SECRET_ACCESS_KEY:prod-secret-key}}
interview.audio.presigned.url.expiry.minutes=15

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.file.name=${LOG_FILE_NAME:logs/ai-interview-app.log}
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO
logging.level.com.aiinterview.face2hire_backend=INFO

# OpenAI
openai.api.key=${OPENAI_API_KEY:prod-openai-api-key}
openai.whisper.model=${OPENAI_WHISPER_MODEL:whisper-1}
openai.gpt.model=${OPENAI_GPT_MODEL:gpt-4o-mini}
openai.tts.model=${OPENAI_TTS_MODEL:tts-1}

# OTP Configuration
otp.expiry.seconds=${OTP_EXPIRY_SECONDS:180}
otp.max.requests.per.hour=${OTP_MAX_REQUESTS_PER_HOUR:3}
otp.block.duration.minutes=${OTP_BLOCK_DURATION_MINUTES:15}
otp.max.failed.attempts=${OTP_MAX_FAILED_ATTEMPTS:3}
otp.failed.attempts.window.minutes=${OTP_FAILED_ATTEMPTS_WINDOW_MINUTES:5}
otp.cleanup.interval.seconds=${OTP_CLEANUP_INTERVAL_SECONDS:30}
otp.max.cache.size=${OTP_MAX_CACHE_SIZE:10000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.env.enabled=true
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
